<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Irika</title>

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:"Segoe UI",sans-serif;
        }

        body{
            background:#eceff1;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .chat-container{
            width:95%;
            max-width:900px;
            height:92vh;
            background:#fff;
            border-radius:18px;
            overflow:hidden;
            display:flex;
            flex-direction:column;
            box-shadow:0 10px 30px rgba(0,0,0,.15);
        }

        /* Header */

        .chat-header{
            background:#2563eb;
            color:white;
            padding:18px 22px;
            display:flex;
            align-items:center;
            gap:15px;
        }

        .avatar{
            width:50px;
            height:50px;
            border-radius:50%;
            background:white;
            color:#2563eb;
            display:flex;
            justify-content:center;
            align-items:center;
            font-size:25px;
        }

        .header-text h2{
            font-size:22px;
        }

        .header-text p{
            font-size:13px;
            opacity:.8;
        }

        /* Chat */

        .chat-box{
            flex:1;
            overflow-y:auto;
            padding:25px;
            background:#f5f7fb;
        }

        .message{
            display:flex;
            margin-bottom:18px;
        }

        .user{
            justify-content:flex-end;
        }

        .bot{
            justify-content:flex-start;
        }

        .bubble{
            max-width:75%;
            padding:14px 18px;
            border-radius:18px;
            line-height:1.5;
            word-wrap:break-word;
        }

        .user .bubble{
            background:#2563eb;
            color:white;
            border-bottom-right-radius:6px;
        }

        .bot .bubble{
            background:white;
            color:#111827;
            border:1px solid #ddd;
            border-bottom-left-radius:6px;
        }

        /* Welcome */

        .welcome{
            text-align:center;
            margin-top:120px;
            color:#666;
        }

        .welcome h2{
            color:#111827;
            margin-bottom:10px;
        }

        /* Input */

        .input-area{
            background:white;
            padding:18px;
            border-top:1px solid #ddd;
        }

        form{
            display:flex;
            gap:12px;
        }

        input{
            flex:1;
            padding:15px;
            border-radius:30px;
            border:1px solid #ccc;
            outline:none;
            font-size:15px;
        }

        input:focus{
            border-color:#2563eb;
        }

        button{
            width:55px;
            border:none;
            border-radius:50%;
            background:#2563eb;
            color:white;
            font-size:20px;
            cursor:pointer;
            transition:.3s;
        }

        button:hover{
            background:#1d4ed8;
        }

    </style>

</head>

<body>

<div class="chat-container">

    <!-- Header -->

    <div class="chat-header">

        <div class="avatar">
            🤖
        </div>

        <div class="header-text">
            <h2>AI Irika</h2>
            <p>Online • Powered by TinyLlama</p>
        </div>

    </div>

    <!-- Chat -->

    <div class="chat-box" id="chatBox">

        {% if chats|length == 0 %}

        <div class="welcome">
            <h2>Hello 👋</h2>
            <p>Ask me anything to start chatting.</p>
        </div>

        {% else %}

            {% for chat in chats %}

            <div class="message user">
                <div class="bubble">
                    {{ chat.user_message }}
                </div>
            </div>

            <div class="message bot">
                <div class="bubble">
                    {{ chat.bot_reply }}
                </div>
            </div>

            {% endfor %}

        {% endif %}

    </div>

    <!-- Input -->

    <div class="input-area">

        <form method="POST">

            <input
                type="text"
                name="user_input"
                placeholder="Type your message..."
                autocomplete="off"
                required
            >

            <button type="submit">➤</button>

        </form>

    </div>

</div>

<script>

    const chatBox = document.getElementById("chatBox");
    chatBox.scrollTop = chatBox.scrollHeight;

</script>

</body>
</html>
